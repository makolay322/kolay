plugins { id 'com.android.application' }

def vp = new Properties(); file('version.properties').withInputStream { vp.load(it) }
def ksFile = file("${System.getProperty('user.home')}/.kolay/keystore.properties")
def ks = new Properties(); if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'app.kolay.payload'
    compileSdk 34
    defaultConfig {
        applicationId 'app.kolay.payload'
        minSdk 29
        targetSdk 34
        versionCode vp.getProperty('versionCode').toInteger()
        versionName vp.getProperty('versionName')
    }
    signingConfigs {
        release {
            if (ks) { storeFile file(ks.storeFile); storePassword ks.storePassword; keyAlias ks.keyAlias; keyPassword ks.keyPassword }
        }
    }
    buildTypes { release { signingConfig ks ? signingConfigs.release : signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Everything below is provided at runtime by the shell's class loader: never bundle it into the payload.
dependencies {
    compileOnly project(':sdk')
    compileOnly 'com.github.adaptech-cz.Tesseract4Android:tesseract4android-openmp:4.8.0'
}
