plugins { id 'com.android.application' }

def ksFile = file("${System.getProperty('user.home')}/.kolay/keystore.properties")
def ks = new Properties(); if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'app.kolay.shell'
    compileSdk 34
    defaultConfig {
        applicationId 'app.kolay'
        minSdk 29
        targetSdk 34
        versionCode 10
        versionName '1.008'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            if (ks) { storeFile file(ks.storeFile); storePassword ks.storePassword; keyAlias ks.keyAlias; keyPassword ks.keyPassword }
        }
    }
    buildTypes { release { signingConfig ks ? signingConfigs.release : signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    aaptOptions { noCompress 'traineddata', 'apk' }
}

// Offline fallback: the current payload ships inside the shell as assets/payload.apk.
def bundleDir = layout.buildDirectory.dir('generated/payloadAssets')
tasks.register('bundlePayload', Copy) {
    dependsOn ':payload:assembleRelease'
    from(project(':payload').layout.buildDirectory.file('outputs/apk/release/payload-release.apk')) { rename { 'payload.apk' } }
    from(project(':payload').file('version.properties')) { rename { 'payload.properties' } }
    into bundleDir
}
android.sourceSets.main.assets.srcDir(bundleDir)
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'bundlePayload' }

dependencies {
    implementation project(':sdk')
    implementation 'com.github.adaptech-cz.Tesseract4Android:tesseract4android-openmp:4.8.0'
    implementation 'com.google.zxing:core:3.5.3'   // QR decoding; pure Java, shared with the payload
}
