name: purge-releases
# Manual only: deletes every Release (and its tag) except the latest one. Run after a new release is confirmed live.
on:
  workflow_dispatch:
permissions:
  contents: write   # delete releases + tags; nothing else
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all but the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest=$(gh release list --json tagName,isLatest -q '.[] | select(.isLatest) | .tagName')
          [ -n "$latest" ] || { echo "no latest release; refusing to delete anything"; exit 1; }
          echo "keeping $latest"
          gh release list --limit 200 --json tagName -q '.[].tagName' | while read -r t; do
            [ "$t" = "$latest" ] && continue
            echo "deleting $t"; gh release delete "$t" --cleanup-tag --yes
          done
