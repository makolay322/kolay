name: build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Secret scan (patterns that must never be committed)
        run: |
          if git grep -nIE 'AIza[0-9A-Za-z_-]{35}|-----BEGIN (EC |RSA )?PRIVATE KEY-----|gemini\.key=' -- . ':!.github' ':!SECURITY.md' ':!CLAUDE.md' ':!docs'; then
            echo "::error::possible secret committed"; exit 1; fi
      - name: Build (debug-signed; no release keys exist in CI)
        run: ./gradlew --no-daemon :shell:assembleRelease
