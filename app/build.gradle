plugins { id 'com.android.application' }

// versionCode/versionName: base values here; tools/release.sh writes the next release's numbers before building.
def vp = new Properties(); file('version.properties').withInputStream { vp.load(it) }
def ksFile = file("${System.getProperty('user.home')}/.kolay/keystore.properties")
def ks = new Properties(); if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    // Kept as app.kolay.shell: the manifest's component names (launcher activity, widget, tile) must not change,
    // otherwise home-screen shortcuts, placed widgets and the quick-settings tile disappear on update.
    namespace 'app.kolay.shell'
    compileSdk 34
    defaultConfig {
        applicationId 'app.kolay'
        minSdk 29
        targetSdk 34
        versionCode vp.getProperty('versionCode').toInteger()
        versionName vp.getProperty('versionName')
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            if (ks) { storeFile file(ks.storeFile); storePassword ks.storePassword; keyAlias ks.keyAlias; keyPassword ks.keyPassword }
        }
    }
    buildTypes {
        release {
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true          // R8: drops unused code (mostly from ZXing) and optimizes the rest
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // Smaller download: every update fetches the whole APK, and the Tesseract libraries are ~80% of it. Compressed native
    // libraries are unpacked once at install time (a few MB more on the phone, about half the download).
    packaging { jniLibs { useLegacyPackaging true } }
}

dependencies {
    implementation 'com.github.adaptech-cz.Tesseract4Android:tesseract4android-openmp:4.8.0'
    implementation 'com.google.zxing:core:3.5.3'   // QR / barcode decoding (pure Java)
}
